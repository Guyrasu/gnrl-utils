<div class="flex flex-col">
  How much since/to this time?
  When this happened/will happens?
  <input
    #timeInput
    (input)="onInput(timeInput.value)"
    type="text"
    class="border-2 border-blue-500"
  />
  <button (click)="tempo(timeInput.value)">
    This is {{ finishDate() }}
  </button>
</div>
